[project]
name = "solar-corona-pinns"
version = "0.1.0"
description = "Reproducible PINN and Grad-Rubin solar coronal magnetic-field reconstruction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nf2>=0.4.2",
    "scipy>=1.13.1",
    "pyyaml>=6.0.2",
    "scienceplots>=2.2.2",
]

[project.scripts]
nf2-sharp = "nlfff.pinn.run_nf2_sharp:main"
grad-rubin = "nlfff.grad_rubin.run_grad_rubin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlfff", "studies"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff>=0.16.1",
]
pinn = [
    "matplotlib==3.11.0",
    "nf2==0.4.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
]
grad-rubin = [
    "cupy-cuda12x==13.6.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "fastqslpy==0.0.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "matplotlib==3.11.0",
    "nf2==0.4.2",
    "scipy==1.17.1; python_version < '3.12'",
    "scipy==1.18.0; python_version >= '3.12'",
    "torch==2.6.0",
    "torchvision==0.21.0",
]
euv = [
    "drms>=0.9.0",
    "sunpy[map]>=7.0.0",
]

[tool.uv.sources]
fastqslpy = { git = "https://github.com/peijin94/FastQSL.git", rev = "ef98356ce6615323da51f5a3d95bd88427f2a9ad" }
nf2 = { git = "https://github.com/ackl/NF2.git", branch = "pot_field_greens_refactor" }
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
