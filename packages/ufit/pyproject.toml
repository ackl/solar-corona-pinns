[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ufit"
version = "0.1.0"
description = "UFiT Fortran field-line tracer built from the pinned third_party/UFiT checkout"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.hatch.build.targets.wheel]
packages = ["src/ufit"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build.py"
