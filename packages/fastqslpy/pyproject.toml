[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastqslpy"
version = "0.0.1"
description = "FastQSL CUDA tracer built from the pinned third_party/FastQSL checkout"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build.py"
